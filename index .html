            { q: '家门口养老服务站属于？', opts: ['社区养老', '居家养老', '机构养老', '医养结合'], ans: 0 },
            { q: '认知障碍照护床位属于？', opts: ['养老服务', '医疗服务', '精神卫生', '康复护理'], ans: 0 },
            { q: '适老化改造主要针对？', opts: ['老年人', '残疾人', '儿童', '全龄'], ans: 0 },
            { q: '普惠托育一体化属于？', opts: ['学前教育', '托育服务', '儿童福利', '公共服务'], ans: 1 },
            { q: '世界技能大赛在哪个城市举办？', opts: ['上海', '北京', '广州', '深圳'], ans: 0 },
            { q: '新型储能属于？', opts: ['能源技术', '储能技术', '新能源', '以上都是'], ans: 3 },
            { q: '零碳园区属于？', opts: ['低碳示范', '零碳转型', '绿色园区', '以上都是'], ans: 3 },
            { q: '公共建筑节能改造主要针对？', opts: ['既有建筑', '新建建筑', '所有建筑', '住宅'], ans: 0 },
            { q: '“五个中心先手棋作用”属于？', opts: ['十五五核心抓手', '四个放在', '四大功能', '新质生产力'], ans: 0 },
            { q: '强化四大功能中“高端产业引领”属于？', opts: ['四大功能', '五个中心', '新质生产力', '十五五'], ans: 0 },
            { q: '发展新质生产力，强调？', opts: ['传统产业升级', '新兴产业培育', '未来产业布局', '以上都是'], ans: 3 },
            { q: '“内涵式、集约型、绿色化、精细化”属于？', opts: ['超大城市现代化新路', '城市治理', '城市空间', '绿色发展'], ans: 0 },
            { q: '沪派江南文化传承属于？', opts: ['文化建设', '乡村振兴', '历史保护', '文旅融合'], ans: 0 },
            { q: '长三角生态绿色一体化示范区属于？', opts: ['区域战略', '绿色发展', '长三角一体化', '以上都是'], ans: 3 },
            { q: '“新城功能跃升”属于？', opts: ['五个新城', '南北转型', '一江一河', '千园之城'], ans: 0 },
            { q: '“湾区科创城”位于？', opts: ['金山', '奉贤', '浦东', '宝山'], ans: 0 },
            { q: '“一网统管”中“数字体征”主要指？', opts: ['城市运行状态', '经济指标', '人口数据', '环境数据'], ans: 0 },
            { q: '“全域无废城市”中“建筑垃圾资源化”属于？', opts: ['固废资源化', '循环利用', '绿色建造', '以上都是'], ans: 3 },
            { q: '上海“十五五”规划中，全员劳动生产率目标值？', opts: ['≥52万元/人', '≥55万元/人', '≥60万元/人', '≥48万元/人'], ans: 0 },
            { q: '基础研究占比提升至多少？', opts: ['10%', '12%', '15%', '18%'], ans: 1 },
            { q: '以下哪个属于五型经济？', opts: ['流量型', '数字型', '平台型', '共享型'], ans: 0 },
            { q: '四大品牌中“上海购物”体现？', opts: ['消费中心', '商业品牌', '国际消费', '以上都是'], ans: 3 },
            { q: '“沪派江南”不包括？', opts: ['特色村落', '风貌保护', '水乡文化', '海派文化'], ans: 3 },
            { q: '五个新城“区区结对”目的是？', opts: ['产业协同', '人才交流', '公共服务', '生态共建'], ans: 0 },
            { q: '“南北转型”中“滨江邮轮带”位于？', opts: ['宝山', '金山', '浦东', '杨浦'], ans: 0 },
            { q: '“一江一河一带”中“一带”指？', opts: ['外环绿道', '滨江绿带', '环城绿带', '生态廊道'], ans: 0 },
            { q: '“千园之城”目标新增公园数？', opts: ['100座', '150座', '200座', '80座'], ans: 0 },
            { q: '“五违四必”中“四必”强调？', opts: ['整治违法', '消除隐患', '环境治理', '以上都是'], ans: 3 }
        ];

        // 补充至200题
        while (baseQuestions.length < 200) {
            baseQuestions.push({ q: '（补充题）上海“五个中心”不包括以下哪个？', opts: ['国际经济中心', '国际金融中心', '国际贸易中心', '国际文化中心'], ans: 3 });
        }

        // ---------- 打乱顺序 ----------
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        const shuffledQuestions = shuffleArray(baseQuestions.slice(0, 200));

        // ---------- 渲染逻辑 ----------
        const container = document.getElementById('questionContainer');
        const progressDisplay = document.getElementById('progressDisplay');

        let selectedState = new Array(shuffledQuestions.length).fill(null);
        let revealedState = new Array(shuffledQuestions.length).fill(false);

        function renderQuestions() {
            let html = '';
            shuffledQuestions.forEach((q, idx) => {
                const selected = selectedState[idx];
                const revealed = revealedState[idx];

                let optionsHtml = '';
                q.opts.forEach((opt, optIdx) => {
                    let optionClass = 'option';
                    let checkedAttr = (selected === optIdx) ? 'checked' : '';

                    if (revealed) {
                        if (optIdx === q.ans) {
                            optionClass += ' correct-reveal';
                        } else if (selected === optIdx && selected !== q.ans) {
                            optionClass += ' wrong-reveal';
                        }
                    } else if (selected === optIdx) {
                        optionClass += ' selected';
                    }

                    optionsHtml += `
                        <div class="${optionClass}" data-qidx="${idx}" data-optidx="${optIdx}">
                            <input type="radio" name="q${idx}" value="${optIdx}" ${checkedAttr} data-qidx="${idx}" data-optidx="${optIdx}">
                            <span>${String.fromCharCode(65 + optIdx)}. ${opt}</span>
                        </div>
                    `;
                });

                let feedbackHtml = '';
                if (revealed && selected !== null) {
                    const isCorrect = (selected === q.ans);
                    const correctLetter = String.fromCharCode(65 + q.ans);
                    const statusText = isCorrect ? '✅ 回答正确！' : '❌ 回答错误';
                    feedbackHtml = `
                        <div class="feedback show" style="border-left-color: ${isCorrect ? '#1f8b6b' : '#b34a54'};">
                            <span class="${isCorrect ? 'correct-answer' : 'wrong-label'}">${statusText}</span>
                            &nbsp; 正确答案：<span class="correct-answer">${correctLetter}. ${q.opts[q.ans]}</span>
                        </div>
                    `;
                }

                html += `
                    <div class="question-item" data-qidx="${idx}">
                        <div class="q-text">${idx+1}. ${q.q}</div>
                        <div class="options" data-qidx="${idx}">
                            ${optionsHtml}
                        </div>
                        ${feedbackHtml}
                    </div>
                `;
            });
            container.innerHTML = html;
            updateProgress();
            attachEvents();
        }

        function attachEvents() {
            container.addEventListener('change', function(e) {
                const target = e.target;
                if (target.matches('input[type="radio"]')) {
                    const qIdx = parseInt(target.dataset.qidx);
                    const optIdx = parseInt(target.dataset.optidx);
                    if (!isNaN(qIdx) && !isNaN(optIdx)) {
                        if (revealedState[qIdx]) {
                            const prev = selectedState[qIdx];
                            const radio = document.querySelector(`input[name="q${qIdx}"]:checked`);
                            if (radio) radio.checked = false;
                            if (prev !== null) {
                                const prevRadio = document.querySelector(`input[name="q${qIdx}"][value="${prev}"]`);
                                if (prevRadio) prevRadio.checked = true;
                            }
                            return;
                        }
                        selectedState[qIdx] = optIdx;
                        revealedState[qIdx] = true;
                        renderQuestions();
                    }
                }
            });

            container.addEventListener('click', function(e) {
                const optionDiv = e.target.closest('.option');
                if (optionDiv && !e.target.closest('input[type="radio"]')) {
                    const radio = optionDiv.querySelector('input[type="radio"]');
                    if (radio) {
                        const qIdx = parseInt(radio.dataset.qidx);
                        if (revealedState[qIdx]) return;
                        radio.checked = true;
                        const changeEvent = new Event('change', { bubbles: true });
                        radio.dispatchEvent(changeEvent);
                    }
                }
            });
        }

        function updateProgress() {
            let answered = 0;
            for (let i = 0; i < shuffledQuestions.length; i++) {
                if (selectedState[i] !== null) answered++;
            }
            progressDisplay.textContent = `${answered} / ${shuffledQuestions.length} 已答`;
        }

        function resetAll() {
            selectedState.fill(null);
            revealedState.fill(false);
            renderQuestions();
        }

        document.getElementById('resetAllBtn').addEventListener('click', resetAll);
        renderQuestions();
    })();
</script>
